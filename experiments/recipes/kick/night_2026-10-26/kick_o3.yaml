why: '[llm:claude] gap bench v2 full: short_stop_m is h022''s weakest power-by-range metric
  (2.9-3.1 m) and the regression that failed n1 (3.7-4.1 m); pose study 2026-10-26: our short
  passes leave at 1.5x the needed speed for every pose, B-Human''s at 1.25x stop 1.4 m from
  the target: halfway (300 it): -600 left short passes at 1.51x needed (h022 1.49x) while
  long power, aim, time to kick and goals improved; -300 drifted to 1.60x. Stronger dose.
  kick_rest_accuracy pays seconds later, at rest, times quality; the overpower term charges
  at the kick, where the policy chooses the swing. Fraction above 1.25x needed, capped at
  1 (2.5x): -600 x 0.16-0.24 at today''s 1.55x. Long kicks untouched (long_kick_underpower
  guards them; v54b lesson: soft passes leaking into long kicks). Risk: hesitant short kicks
  (time to kick up). (evidence: bhuman_isaacgymrl)'
