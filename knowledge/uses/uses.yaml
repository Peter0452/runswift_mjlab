- id: u018
  approach: staged_curriculum
  source: ours
  part: warm-start handoff with re-initialised placeholder slots
  task: kick
  context: stage 1 -> stage 2
  result: positive
  finding: A plain resume collapsed stage 2 (KL 22); the reset fixed it (ball distance 2.5 -> 0.65 m in 60 iterations).
  evidence: knowledge/skills/kick.md

- id: u019
  approach: vision_model
  source: ours
  part: IMU-only ball memory (no odometry)
  task: kick
  context: robot test, 2026-10-02
  result: positive
  finding: Training with odometry-based memory made the head and approach fail on the robot; the runner has no odometry, so training uses rotation-only memory.
  evidence: knowledge/session_notes/k1-kick-staged-training.md
  date: 2026-10-02

- id: u020
  approach: hierarchical_controller
  source: ours
  part: GRU controller over frozen kick and walk skills
  task: striker
  context: controller v2-v7
  result: mixed
  finding: controller_v2 + h022 reached 0.441 goal share vs h022; v3-v7 did not beat v2; the decision layer adds only ~+0.02-0.04 over a scripted rule.
  evidence: knowledge/skills/selfplay_striker.md

- id: u021
  approach: self_play
  source: bansal2018_competition
  part: 1v1 fine-tune against frozen copies and a pool
  task: selfplay
  context: v15/v16, SWA
  result: positive
  finding: swa_v15v16_9100 beats h022 under the same scripted controller (0.421 vs 0.402, 6/6 seeds); deployed at the user's request.
  evidence: knowledge/skills/selfplay_striker.md
  status_effect: adopted

- id: u022
  approach: selfplay_shaping_anneal
  source: bansal2018_competition
  part: anneal task shaping toward the game reward
  task: selfplay
  context: v13-v16 froze alpha instead of annealing to 0.2
  result: none
  finding: Not tested as asked; the deviation (frozen alpha) was reported.
  evidence: knowledge/objectives.md

- id: u023
  approach: world_model_ball
  source: deployment_scenarios
  part: world-ball inputs (ball seen at any bearing) in training, s.world_ball_prob 0.3
  task: kick
  context: hier loop h019-h021 (2026-10-09), with the cold starts and aim_tight; from h012_c1_18000
  result: negative
  finding: Not promoted (screens +40..+69 vs parent +77.5). exp_world2_18798 scored +109 vs the champion but regressed short_stop, robust goals and action_rate. Truth-input ball-behind cold-start falls stayed (~10/90; cold-behind sim falls 50 %). Bundled with other changes and judged against a single-screen parent bar (monitor 2026-10-09 07:58), so it is weak evidence.
  evidence: docs/evolution/monitor.md
