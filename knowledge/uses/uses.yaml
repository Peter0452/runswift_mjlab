# Uses: each time we applied an approach (or part of one) in a task, and what
# happened. One entry per use; negative results stay. Format in README.md.
# Seeded 2026-10-25 from the approach cards' evidence and the L5 catalogue;
# dates are when the result was recorded, where the source note gives one.

- id: u001
  approach: amp
  source: peng2021_amp
  part: style reward from a discriminator on WW + CMU walk clips
  task: walk
  context: AMP walk (gold walk model_9950)
  settings: {style_reward_weight: 0.2}
  result: positive
  finding: Style weight 0.2 works; 0.5 at 98 % discriminator accuracy is saturated noise that washed out velocity tracking.
  evidence: knowledge/skills/walk.md
  status_effect: adopted (in every deployed model)

- id: u002
  approach: amp
  source: peng2021_amp
  part: unconditioned style prior
  task: dribble
  context: faster clip mix for speed (v19)
  result: negative
  finding: An unconditioned style prior copies the clips' posture; the faster mix leaned the dribble 16 degrees (lesson R25).
  evidence: knowledge/skills/dribble.md
  date: 2026-10-20

- id: u003
  approach: conditioned_amp
  source: ours
  part: command-conditioned discriminator (amp_cond)
  task: dribble
  context: v20, after the faster mix leaned the dribble
  result: mixed
  finding: Helped a little (+0.05-0.08); runner leg jitter rose 0.066 -> 0.080.
  evidence: knowledge/skills/dribble.md

- id: u004
  approach: caps
  source: mysore2021_caps
  part: temporal regulariser
  task: dribble
  context: dribble lineage
  settings: {temporal: 2.0}
  result: negative
  finding: CAPS 2.0 made recoveries sluggish; temporal 1.0 stays on in the dribble.
  evidence: knowledge/skills/dribble.md

- id: u005
  approach: caps
  source: mysore2021_caps
  part: temporal regulariser, with a strong foot-flat penalty
  task: kick
  context: stage 3 v24
  settings: {temporal: 1.0}
  result: negative
  finding: The policy stood still in front of far balls; a smooth policy can be standing still (E7). The champion h022 trained with temporal 1.0, spatial 0.4.
  evidence: knowledge/skills/kick.md

- id: u006
  approach: kick_teacher
  source: ours
  part: MSE imitation of the kick-loop teacher h011 (legs) near the ball
  task: dribble
  context: dribble kick mode, teacher off in v34
  result: positive
  finding: Teacher off dropped kick power to 2.63 m/s; the teacher anchors dribble kick power.
  evidence: knowledge/skills/dribble.md

- id: u007
  approach: kick_teacher
  source: ours
  part: straight-kick-only teaching
  task: dribble
  context: v36
  result: positive
  finding: Inside-foot kicks rose 11 -> 24 %.
  evidence: knowledge/skills/dribble.md

- id: u008
  approach: bhuman_action_imitation
  source: bhuman_isaacgymrl
  part: B-Human's kick policy as teacher / executor near the ball
  task: dribble
  context: v41 (teacher), v43 (takeover)
  result: negative
  finding: v41 collapsed our kick (1.96 m/s, 37 deg); takeover (v43) also hurt. Don't retry plain action imitation of B-Human.
  evidence: knowledge/skills/dribble.md
  status_effect: rejected

- id: u009
  approach: kl_anchor
  source: vinyals2019_alphastar
  part: KL to a frozen reference policy, decaying
  task: selfplay
  context: self-play fine-tunes of h022
  settings: {coef: 0.5, coef_final: 0.1, lr: 1.0e-4}
  result: positive
  finding: Fine-tunes drifted 22-36 % in actor weights and got worse vs h022; fixed LR 1e-4 plus the anchor fixed it (E18). Anchor to the best checkpoint after a reward fix, not the old baseline.
  evidence: knowledge/skills/selfplay_striker.md

- id: u010
  approach: muon
  source: jordan2024_muon
  part: Muon for actor and critic matrices
  task: selfplay
  context: fine-tunes at the adaptive LR
  result: mixed
  finding: Adopted for all AMP tasks; at the adaptive LR (~1e-3) a fine-tune random-walks; fixed LR 1e-4 worked (E18).
  evidence: knowledge/approaches/optimisation/muon.md

- id: u011
  approach: swa_blend
  source: izmailov2018_swa
  part: weight averaging of nearby checkpoints
  task: selfplay
  context: swa_v15v16_9100 (deployed)
  result: positive
  finding: SWA is a cheap, reliable gain (E21); swa_v15v16 beat h022 0.421 vs 0.402 goal share, 6/6 seeds.
  evidence: knowledge/skills/selfplay_striker.md

- id: u012
  approach: swa_blend
  source: izmailov2018_swa
  part: weight-space blend of dribble and kick skills
  task: dribble
  context: skill blend
  result: negative
  finding: Blending the dribble and kick skills gives the worst of both (R27); blends don't fine-tune well afterwards (ft_x50a/b 170 -> 80-98 goals).
  evidence: knowledge/approaches/optimisation/swa_blend.md

- id: u013
  approach: swa_blend
  source: izmailov2018_swa
  part: SWA checkpoint deployed on the robot
  task: dribble
  context: swaA on the real robot
  result: mixed
  finding: swaA fell 1.9 times per upright minute on the robot; the benchmark gate still applies to averaged checkpoints.
  evidence: knowledge/skills/dribble.md

