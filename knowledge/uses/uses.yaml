# Uses: each time we applied an approach (or part of one) in a task, and what
# happened. One entry per use; negative results stay. Format in README.md.
# Seeded 2026-10-25 from the approach cards' evidence and the L5 catalogue;
# dates are when the result was recorded, where the source note gives one.

- id: u001
  approach: amp
  source: peng2021_amp
  part: style reward from a discriminator on WW + CMU walk clips
  task: walk
  context: AMP walk (gold walk model_9950)
  settings: {style_reward_weight: 0.2}
  result: positive
  finding: Style weight 0.2 works; 0.5 at 98 % discriminator accuracy is saturated noise that washed out velocity tracking.
  evidence: knowledge/skills/walk.md
  status_effect: adopted (in every deployed model)

- id: u002
  approach: amp
  source: peng2021_amp
  part: unconditioned style prior
  task: dribble
  context: faster clip mix for speed (v19)
  result: negative
  finding: An unconditioned style prior copies the clips' posture; the faster mix leaned the dribble 16 degrees (lesson R25).
  evidence: knowledge/skills/dribble.md
  date: 2026-10-20

- id: u003
  approach: conditioned_amp
