- id: u009
  approach: kl_anchor
  source: vinyals2019_alphastar
  part: KL to a frozen reference policy, decaying
  task: selfplay
  context: self-play fine-tunes of h022
  settings: {coef: 0.5, coef_final: 0.1, lr: 1.0e-4}
  result: positive
  finding: Fine-tunes drifted 22-36 % in actor weights and got worse vs h022; fixed LR 1e-4 plus the anchor fixed it (E18). Anchor to the best checkpoint after a reward fix, not the old baseline.
  evidence: knowledge/skills/selfplay_striker.md

